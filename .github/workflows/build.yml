name: build-arti

on:
  push:
    tags: ['arti-v*']   # manual versioned releases only; commits to main do NOT trigger
  schedule:
    # daily probe at 18:17 UTC; gates below fire every 15th day (build) and
    # every 30th day (build + release), anchored to 2026-10-15 (epoch day 20741)
    - cron: '17 18 * * *'
  workflow_dispatch:
    inputs:
      release:
        description: 'Also publish a GitHub Release after build'
        type: boolean
        default: false

permissions:
  contents: write

env:
  ARTI_VERSION: '2.7.0'
  CARGO_PROFILE_RELEASE_LTO: 'thin'
  CARGO_PROFILE_RELEASE_STRIP: 'symbols'
  CARGO_PROFILE_RELEASE_DEBUG: '0'
  # Linux 系全功能集（对照 arti 2.7.0 的 65 个 feature：default 全含 +
  # full 增量（去 async-std 双 runtime 与 journald）+ experimental 增量（去 opentelemetry 重复项），
  # TLS provider 统一 rustls-ring（唯一覆盖全部交叉目标的组合）
  FEATURES_LINUX: >-
    tokio rustls-ring bridge-client compression dns-proxy flowctl-cc harden
    onion-service-client pt-client vanguards http-connect onion-service-service
    keymgr rpc restricted-discovery syslog opentelemetry-appender-tracing
    counter-galois-onion ctor-keystore static-sqlite metrics hs-pow-full hsc
    hsc-negotiate-extensions hss-negotiate-extensions onion-service-cli-extra
    experimental-api tokio-console opentelemetry
  # Windows 无 syslog（tracing syslog 走 unix socket）
  FEATURES_WIN: >-
    tokio rustls-ring bridge-client compression dns-proxy flowctl-cc harden
    onion-service-client pt-client vanguards http-connect onion-service-service
    keymgr rpc restricted-discovery opentelemetry-appender-tracing
    counter-galois-onion ctor-keystore static-sqlite metrics hs-pow-full hsc
    hsc-negotiate-extensions hss-negotiate-extensions onion-service-cli-extra
    experimental-api tokio-console opentelemetry

jobs:
  # schedule-only gate: build every 15 days, release every 30 days
  # (anchor 2026-10-15 = epoch day 20741; first hits: build 10-30, release 11-14)
  tick:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    outputs:
      hit15: ${{ steps.g.outputs.hit15 }}
      hit30: ${{ steps.g.outputs.hit30 }}
    steps:
      - name: Compute 15/30-day ticks
        id: g
        run: |
          D=$(( $(date -u +%s) / 86400 ))
          echo "hit15=$(( D > 20741 && (D - 20741) % 15 == 0 ? 1 : 0 ))" >> "$GITHUB_OUTPUT"
          echo "hit30=$(( D > 20741 && (D - 20741) % 30 == 0 ? 1 : 0 ))" >> "$GITHUB_OUTPUT"

  build:
    needs: tick
    if: >-
      !cancelled() && (
        needs.tick.result == 'skipped' ||
        needs.tick.outputs.hit15 == '1' ||
        needs.tick.outputs.hit30 == '1'
      )
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu,       cross: false, extra: 'journald' }
          - { os: ubuntu-24.04, target: aarch64-unknown-linux-gnu,     cross: true,  extra: '' }
          - { os: ubuntu-24.04, target: armv7-unknown-linux-gnueabihf, cross: true,  extra: '' }
          - { os: ubuntu-24.04, target: i686-unknown-linux-gnu,        cross: true,  extra: '' }
          - { os: ubuntu-24.04, target: riscv64gc-unknown-linux-gnu,   cross: true,  extra: '' }
          - { os: ubuntu-24.04, target: powerpc64le-unknown-linux-gnu, cross: true,  extra: '' }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl,     cross: true,  extra: '' }
          - { os: ubuntu-24.04, target: aarch64-unknown-linux-musl,    cross: true,  extra: '' }
          - { os: windows-2022, target: x86_64-pc-windows-msvc,        cross: false, extra: '' }
          - { os: windows-2022, target: i686-pc-windows-msvc,          cross: false, extra: '' }
          - { os: windows-2022, target: aarch64-pc-windows-msvc,       cross: false, extra: '' }

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Install libsystemd-dev (for journald)
        if: matrix.extra == 'journald'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsystemd-dev pkg-config

      - name: Download arti source (crates.io official, locked)
        shell: bash
        run: |
          curl -fsSLO "https://static.crates.io/crates/arti/arti-${ARTI_VERSION}.crate"
          tar xzf "arti-${ARTI_VERSION}.crate"
          mv "arti-${ARTI_VERSION}" arti-src

      # opentelemetry(OTLP) -> reqwest -> native-tls drags openssl-sys into the tree;
      # cross containers have no libssl, so vendor OpenSSL statically (linux only).
      # Windows uses schannel and must NOT build openssl (nasm dependency).
      - name: Vendor OpenSSL (inject openssl-sys/vendored dep, linux only)
        if: runner.os == 'Linux'
        working-directory: arti-src
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          p = 'Cargo.toml'
          s = open(p).read()
          assert not re.search(r'^\[dependencies\.openssl-sys\]', s, re.M), 'already declared'
          m = re.search(r'^\[dependencies\.[^\]]+\]', s, re.M)
          assert m, 'no [dependencies.*] section found (dotted-key style expected)'
          block = '[dependencies.openssl-sys]\nversion = "0.9"\nfeatures = ["vendored"]\n\n'
          s = s[:m.start()] + block + s[m.start():]
          open(p, 'w').write(s)
          print('injected before', m.group(0))
          PY
          cargo update -p arti
          grep -n "openssl-sys" Cargo.toml Cargo.lock | head -5

      - name: Build (cross)
        if: matrix.cross
        working-directory: arti-src
        run: cross build --release --locked --target ${{ matrix.target }} -p arti --no-default-features --features "${FEATURES_LINUX} ${{ matrix.extra }}"

      - name: Build (native)
        if: matrix.cross == false
        working-directory: arti-src
        shell: bash
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: |
          FE="${FEATURES_LINUX}"
          if [ "${RUNNER_OS}" = "Windows" ]; then FE="${FEATURES_WIN}"; fi
          cargo build --release --locked --target ${{ matrix.target }} -p arti --no-default-features --features "${FE} ${{ matrix.extra }}"

      - name: Package (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          PKG="arti-v${ARTI_VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${PKG}"
          cp "arti-src/target/${{ matrix.target }}/release/arti" "dist/${PKG}/"
          cp arti-src/README.md dist/${PKG}/ 2>/dev/null || true
          cp arti-src/LICENSE* dist/${PKG}/ 2>/dev/null || true
          ( cd dist && tar czf "${PKG}.tar.gz" "${PKG}" && rm -rf "${PKG}" )
          ( cd dist && sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256" )

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $pkg = "arti-v$env:ARTI_VERSION-$env:TARGET"
          New-Item -ItemType Directory -Force -Path "dist/$pkg" | Out-Null
          Copy-Item "arti-src/target/$env:TARGET/release/arti.exe" "dist/$pkg/"
          Copy-Item "arti-src/README.md" "dist/$pkg/" -ErrorAction SilentlyContinue
          Copy-Item "arti-src/LICENSE*" "dist/$pkg/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "dist/$pkg" -DestinationPath "dist/$pkg.zip" -Force
          Remove-Item -Recurse -Force "dist/$pkg"
          (Get-FileHash "dist/$pkg.zip" -Algorithm SHA256).Hash.ToLower() | Out-File "dist/$pkg.zip.sha256" -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  release:
    needs: [tick, build]
    if: >-
      !cancelled() && needs.build.result == 'success' && (
        startsWith(github.ref, 'refs/tags/') ||
        (github.event_name == 'schedule' && needs.tick.outputs.hit30 == '1') ||
        inputs.release == true
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STAMP="$(date -u +%Y%m%d)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="arti-v${ARTI_VERSION}-r${STAMP}"
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists, uploading with --clobber"
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes "Arti v${ARTI_VERSION} full-feature cross builds (auto build ${STAMP}). sha256 checksums included. See README for the feature matrix."
          fi
          ls -la dist/
